    let cls = '', lbl = '';
    if (ss) {
      const t = ss.some(s => s.type === 'festivo') ? 'festivo' : ss.some(s => s.type === 'domenica') ? 'domenica' : 'normale';
      const onlyPlan = ss.every(isPlan);
      cls = `t-${t} ${onlyPlan ? 'pln' + (ss.some(planDue) ? ' due' : '') : ds > today ? 'fut' : ''}`;
      lbl = `<small>${n2(ss.reduce((a, s) => a + shiftHours(s).hours, 0))}h</small>`;
    }
    cal += `<button class="cal-d ${cls} ${ds === today ? 'today' : ''} ${hol ? 'hol' : ''}" data-act="day" data-date="${ds}" aria-label="${d} ${monthName(ym)}${hol ? ', ' + hol : ''}${ss ? (ss.every(isPlan) ? ', turno in programma' : ', turno registrato') : ''}">${d}${lbl}</button>`;
  }
  const groups = [];
  every.forEach(s => {
    const d = parseDate(s.date), mon = new Date(d); mon.setDate(d.getDate() - (d.getDay() + 6) % 7);
    const key = dateStr(mon); let g = groups.find(g => g.key === key); if (!g) groups.push(g = { key, items: [] }); g.items.push(s);
  });

  $('#v-shifts').innerHTML = `
    <h1 class="title"><span>I tuoi</span> turni</h1>
    <section class="card">
      <div class="c-h" style="margin-bottom:16px"><h3 class="c-t">${monthLong(ym)}</h3>
        <div class="lg" style="justify-content:flex-end;color:var(--mu)"><span><i style="background:#fff"></i>Normale</span><span><i style="background:var(--lime)"></i>Domenica</span><span><i style="background:var(--pink)"></i>Festivo</span></div></div>
      <div class="cal">${cal}</div>
      <p class="c-s" style="margin-top:14px;text-align:center">Pieno = fatto · Tratteggiato = in programma · Tocca un giorno per aggiungere</p>
    </section>
    <div class="tiles num">
      <div class="tile l"><small>Turni</small><b>${r.count}</b></div>
      <div class="tile p"><small>Ore</small><b>${n2(Math.round(r.hours * 10) / 10)}</b></div>
      <div class="tile w"><small>In tasca</small><b>${eur0(r.total)}</b></div>
    </div>
    ${groups.length ? groups.map(g => {
      const end = parseDate(g.key); end.setDate(end.getDate() + 6);
      const tot = g.items.filter(s => !isPlan(s)).reduce((a, s) => a + shiftHours(s).hours, 0), sYm = g.key.slice(0, 7), eYm = dateStr(end).slice(0, 7);
      return `<div class="grp"><span>${parseDate(g.key).getDate()}${sYm !== eYm ? ' ' + monthShort(sYm) : ''} – ${end.getDate()} ${monthShort(eYm)}</span><span class="num">${tot ? hFmt(tot) : ''}</span></div>${g.items.map(shiftRow).join('')}`;
    }).join('') : `<div class="empty" style="margin-top:12px">${ico('calendar-plus')}<b>Nessun turno in ${monthName(ym).toLowerCase()}</b>Tocca un giorno del calendario o il + in alto.</div>`}`;
}

/* ===================== ANALISI ===================== */
function rangeMonths() {
  if (ui.range === 'year') { const y = ui.month.slice(0, 4); return Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`); }
  const n = +ui.range; return Array.from({ length: n }, (_, i) => addMonths(ui.month, i - n + 1));
}

function mrr(months) {
  const cur = ymOf(todayStr()), H = 200;
  const max = Math.max(...months.map(m => { const s = stats(m); return s.netto + s.inps + s.irpef + s.tips; }), 1);
  const px = v => (v > 0 ? Math.max(6, v / max * H) : 0);
  return `<div class="mrr" id="mrr">${months.map((m, i) => {
    const s = stats(m), sel = m === ui.month, fut = m > cur;
    const g = px(s.netto), l = px(s.inps + s.irpef), p = px(s.tips), parts = [g, l, p].filter(Boolean);
    const sum = parts.reduce((a, b) => a + b, 0) + Math.max(0, parts.length - 1) * 5;
    const right = i >= Math.ceil(months.length / 2) && months.length > 2;
    const tag = sel ? `<div class="mtag ${right ? 'r' : ''}" style="bottom:${sum + 30}px">${burst('#3a3a3a')}<b class="num">${eur0(s.total)}</b></div><i class="mlead" style="bottom:${sum}px"></i>` : '';
    const d = `animation-delay:${i * .04}s`;
    return `<button class="mcol ${sel ? 'sel' : ''} ${fut ? 'fut' : ''}" data-act="pick-month" data-ym="${m}" aria-label="${monthLong(m)}: ${eur(s.total)} in tasca">
      <span class="mstack" style="animation-delay:${i * .05}s">${tag}${p ? `<i class="mb pk" style="height:${p}px;${d}"></i>` : ''}${l ? `<i class="mb lm" style="height:${l}px;${d}"></i>` : ''}${g ? `<i class="mb gr ${sel ? 'hatch' : ''}" style="height:${g}px;${d}"></i>` : ''}</span>
      <span class="mhrs num">${s.hours ? Math.round(s.hours) + 'h' : '–'}</span>
      <small>${monthShort(m)}</small>
    </button>`;
  }).join('')}</div>`;
}

function runway(r, ym) {
  const c = 150, R = 106, SW = 36, GAP = 5, cap = (SW / 2) / R * 180 / Math.PI;
  const P = deg => { const t = (deg - 90) * Math.PI / 180; return [c + R * Math.cos(t), c + R * Math.sin(t)]; };
  const arc = (a0, a1) => { const [x0, y0] = P(a0), [x1, y1] = P(a1); return `M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };
  const parts = [['Netto', r.netto, INK], ['Mance', r.tips, '#fff'], ['INPS', r.inps, 'var(--pink)'], ['IRPEF', r.irpef, 'var(--green)']];
  const seg = parts.filter(p => p[1] > 0.005), T = seg.reduce((s, p) => s + p[1], 0);
  let g = '';
  if (!seg.length) g += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${INK}" stroke-opacity=".1" stroke-width="${SW}"/>`;
  else if (seg.length === 1) g += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${seg[0][2]}" stroke-width="${SW}"/>`;
  else {
    // ampiezze proporzionali, con un minimo perché anche le fette piccole restino leggibili
    const MIN = 2 * cap + 4, avail = 360 - GAP * seg.length;
    let span = seg.map(p => avail * p[1] / T), fixed = new Set();
    for (let k = 0; k < 4; k++) {
      span.forEach((s, i) => { if (s < MIN) fixed.add(i); });
      const rest = avail - fixed.size * MIN, tot = seg.reduce((s, p, i) => fixed.has(i) ? s : s + p[1], 0);
      span = seg.map((p, i) => fixed.has(i) ? MIN : rest * p[1] / tot);
    }
    let at = GAP / 2;
    seg.forEach((p, i) => { g += `<path d="${arc(at + cap, at + span[i] - cap)}" fill="none" stroke="${p[2]}" stroke-width="${SW}" stroke-linecap="round"/>`; at += span[i] + GAP; });
  }
  g += `<text x="${c}" y="${c + 4}" text-anchor="middle" font-size="${eur0(T).length > 7 ? 38 : 46}" font-weight="500" fill="${INK}" letter-spacing="-1.5">${eur0(T)}</text><text x="${c}" y="${c + 30}" text-anchor="middle" font-size="13" font-weight="600" fill="${INK}" fill-opacity=".55">lordo + mance</text>`;
  const lg = parts.map(([n, v, col]) => `<span class="${v > 0.005 ? '' : 'off'}"><i style="background:${col}"></i>${n}<b>${eur0(v)}</b></span>`).join('');
  const ded = r.inps + r.irpef, base = r.netto + ded || 1, pN = Math.round(r.netto / base * 100);
  return `<section class="card c-lime run">
    <div class="run-h"><button class="circ l2" data-act="month" data-d="-1" aria-label="Mese precedente">${IC.left}</button><h3>${monthName(ym)}</h3><button class="circ l2" data-act="month" data-d="1" aria-label="Mese successivo">${IC.right}</button></div>
    <svg class="ring" viewBox="0 0 300 300" role="img" aria-label="Netto ${eur(r.netto)}, mance ${eur(r.tips)}, INPS ${eur(r.inps)}, IRPEF ${eur(r.irpef)}">${g}</svg>
    <div class="run-lg num">${lg}</div>
    <div class="wpanel">
      <h4>Dal lordo al netto · ${monthName(ym)}</h4>
      <div class="blocks num">
        <div class="blk l" style="flex:${Math.max(.3, r.netto / base)}"><div class="bx">${eur0(r.netto)}</div><i></i><b>${r.lordo ? pN : 0}%</b></div>
        <div class="blk k" style="flex:${Math.max(.3, ded / base)}"><div class="bx">${eur0(ded)}</div><i></i><b>${r.lordo ? 100 - pN : 0}%</b></div>
      </div>
      <p class="wp-s">Netto in busta e trattenute INPS + IRPEF su ${eur(r.lordo)} lordi</p>
    </div>
  </section>`;
}

function goalFoot(val, ym) {
  if (!settings.goal) return '';
  const diff = val - settings.goal, sh = netShares(ym), today = todayStr();
  const done = sh.filter(x => x.s.date <= today).length, plan = sh.length - done;
  const msg = diff >= 0 ? `${ico('check-circle')}<span>Obiettivo superato di <b class="num">${eur0(diff)}</b></span>` : `${ico('target')}<span>Ti mancano <b class="num">${eur0(-diff)}</b></span>`;
  const dots = sh.map(x => `<i class="${x.s.date > today ? 'p' : ''}"></i>`).join('');
  return `<div class="gl-msg ${diff >= 0 ? 'ok' : ''}">${msg}</div>
    ${sh.length ? `<div class="gl-sh"><div class="gl-dots">${dots}</div><small>${done} turn${done === 1 ? 'o' : 'i'} fatt${done === 1 ? 'o' : 'i'}${plan ? ` · ${plan} in programma` : ''}</small></div>` : ''}`;
}
function goalCard(r, ym) {
  const goalVal = settings.goalWithTips ? r.total : r.netto, pct = settings.goal ? goalVal / settings.goal : 0;
  const N = 45, cx = 150, cy = 176, today = todayStr(); let g = '';
  for (let i = 0; i < N; i++) {
    const a = Math.PI + i / (N - 1) * Math.PI, r1 = 86, r2 = i % 2 ? 120 : 134, on = pct > 0 && i / (N - 1) <= Math.min(1, pct);
    g += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(1)}" y1="${(cy + r1 * Math.sin(a)).toFixed(1)}" x2="${(cx + r2 * Math.cos(a)).toFixed(1)}" y2="${(cy + r2 * Math.sin(a)).toFixed(1)}" stroke="${INK}" stroke-width="2" stroke-linecap="round" stroke-opacity="${on ? 1 : .18}"/>`;
  }
  g += `<text x="${cx}" y="${cy - 16}" text-anchor="middle" font-size="44" font-weight="500" fill="${INK}" letter-spacing="-1.5">${Math.round(pct * 100)}%</text>`;
  g += `<text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="13" font-weight="600" fill="${INK}" fill-opacity=".55">${eur0(goalVal)} di ${eur0(settings.goal)}</text>`;
  return `<section class="card c-pink">
    <div class="c-h"><div><h3 class="c-t">Obiettivo mensile</h3><p class="c-s">${settings.goalWithTips ? 'Netto + mance' : 'Solo netto'} del mese</p></div><button class="circ wh" data-act="go" data-view="settings" aria-label="Modifica obiettivo">${ico('target')}</button></div>
    <svg class="gauge" viewBox="0 0 300 190" role="img" aria-label="Obiettivo raggiunto al ${Math.round(pct * 100)}%">${g}</svg>
    ${goalFoot(goalVal, ym)}
  </section>`;
}

function lineChart(months) {
  const W = 340, H = 130, pl = 36, pr = 10, pt = 16, pb = 22, ch = H - pt - pb, vals = months.map(m => stats(m).perHour), max = niceMax(Math.max(...vals, 1));
  const step = months.length > 1 ? (W - pl - pr) / (months.length - 1) : 0;
  const pts = vals.map((v, i) => [pl + i * step, pt + ch - v / max * ch, v]), real = pts.filter(p => p[2] > 0);
  let g = '';
  [0, 1].forEach(f => { const yy = pt + ch - f * ch; g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,${f ? .08 : .16})" ${f ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 6}" y="${yy + 3}" text-anchor="end">${Math.round(max * f)}€</text>`; });
  if (real.length) {
    const d = real.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 1s var(--ease) forwards"/>`;
    const best = real.reduce((a, b) => (b[2] > a[2] ? b : a));
    real.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="${p === best ? 6 : 4}" fill="${p === best ? 'var(--lime)' : 'var(--s1)'}" stroke="${p === best ? 'var(--lime)' : '#fff'}" stroke-width="2"/>`);
    g += `<text x="${best[0]}" y="${best[1] - 12}" text-anchor="middle" style="fill:var(--lime);font-size:12px">${n2(best[2].toFixed(1))}€</text>`;
  }
  months.forEach((m, i) => { if (months.length <= 6 || i % 2 === 0) g += `<text x="${pl + i * step}" y="${H - 4}" text-anchor="middle">${monthShort(m)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resa oraria per mese">${g}</svg>`;
}

function renderStats() {
  const months = rangeMonths(), ym = ui.month, r = stats(ym);
  const agg = months.reduce((a, m) => { const s = stats(m); a.lordo += s.lordo; a.netto += s.netto; a.tips += s.tips; a.hours += s.hours; a.count += s.count; return a; }, { lordo: 0, netto: 0, tips: 0, hours: 0, count: 0 });
  const active = months.filter(m => stats(m).count).length || 1;
  const wd = Array.from({ length: 7 }, () => ({ v: 0, n: 0 }));
  shifts.filter(s => months.includes(ymOf(s.date))).forEach(s => { const m = marginal(s, s.id), i = (parseDate(s.date).getDay() + 6) % 7; wd[i].v += m.netto + (s.tips || 0); wd[i].n++; });
  const wdAvg = wd.map(w => (w.n ? w.v / w.n : 0)), wdMax = Math.max(...wdAvg, 1), bestWd = wdAvg.indexOf(Math.max(...wdAvg));
  const WD = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  const A = ui.cmpA || ym, B = ui.cmpB || addMonths(ym, -1), sa = stats(A), sb = stats(B);
  const cmpRow = (l, a, b, f) => {
    const d = b ? (a - b) / Math.abs(b) * 100 : a ? 100 : 0, cls = Math.abs(d) < .5 ? 'eq' : d > 0 ? 'up' : 'down';
    return `<div class="cmp-row num"><span>${l}</span><b>${f(a)}</b><b class="m">${f(b)}</b><div class="delta ${cls}">${cls === 'eq' ? '=' : (d > 0 ? '+' : '') + Math.round(d) + '%'}</div></div>`;
  };
  const ht = r.byType, hmax = Math.max(ht.normale, ht.domenica, ht.festivo, r.night, 1);
  const hb = (l, v, c, i) => `<div class="hbar"><div class="hbar-top"><span>${l}</span><b class="num">${hFmt(v)}</b></div><div class="hbar-track"><i style="width:${v / hmax * 100}%;background:${c};animation-delay:${i * .07}s"></i></div></div>`;

  $('#v-stats').innerHTML = `
    <h1 class="title"><span>Guadagni di</span><br>${monthName(ym).toLowerCase()}</h1>
    <div class="rng">${[['3', '3 mesi'], ['6', '6 mesi'], ['12', '12 mesi'], ['year', 'Anno ' + ym.slice(0, 4)]].map(([k, l]) => `<button data-act="range" data-r="${k}" class="${ui.range === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="lg" style="color:#ddd"><span><i style="background:var(--pink)"></i>Mance</span><span><i style="background:var(--lime)"></i>Trattenute</span><span><i style="background:var(--green);box-shadow:inset 0 0 0 1px #2c9672"></i>Netto</span><span><i style="background:#fff"></i>Ore</span></div>
    ${mrr(months)}
    <div class="kgrid num">
      <div class="kc">Netto<b>${eur0(agg.netto)}</b></div><div class="kc">Mance<b>${eur0(agg.tips)}</b></div><div class="kc">Media/mese<b>${eur0((agg.netto + agg.tips) / active)}</b></div>
      <div class="kc">Lordo<b>${eur0(agg.lordo)}</b></div><div class="kc">Ore<b>${n2(Math.round(agg.hours))}</b></div><div class="kc">Turni<b>${agg.count}</b></div>
    </div>
    ${runway(r, ym)}
    ${goalCard(r, ym)}
    <section class="card">
      <h3 class="c-t">Confronta mesi</h3><p class="c-s">Passati, in corso o pianificati</p>
      <div class="cmp-sel">${pickField('month', 'cmpA', A, { title: 'Primo mese' })}<span class="vs">VS</span>${pickField('month', 'cmpB', B, { title: 'Secondo mese' })}</div>
      ${cmpRow('In tasca', sa.total, sb.total, eur0)}${cmpRow('Netto', sa.netto, sb.netto, eur0)}${cmpRow('Lordo', sa.lordo, sb.lordo, eur0)}
      ${cmpRow('Mance', sa.tips, sb.tips, eur0)}${cmpRow('Ore', sa.hours, sb.hours, v => n2(Math.round(v * 10) / 10))}${cmpRow('Turni', sa.count, sb.count, v => v)}${cmpRow('€/ora', sa.perHour, sb.perHour, v => eur(v))}
    </section>
    <section class="card"><h3 class="c-t">Resa oraria</h3><p class="c-s">Netto + mance per ora lavorata</p>${lineChart(months)}</section>
    <section class="card"><h3 class="c-t">Ore per tipologia</h3><p class="c-s">${monthLong(ym)}</p>
      ${hb('Normali', ht.normale, '#fff', 0)}${hb('Domenicali', ht.domenica, 'var(--lime)', 1)}${hb('Festive', ht.festivo, 'var(--pink)', 2)}${hb('Notturne (sovrapposte)', r.night, 'var(--green2)', 3)}
    </section>
    <section class="card">
      <div class="c-h"><div><h3 class="c-t">Giorni migliori</h3><p class="c-s">Media per turno (netto + mance) nel periodo</p></div>${wd.some(w => w.n) ? `<span class="pill">${ico('star')}${WD[bestWd]}</span>` : ''}</div>
      ${wd.some(w => w.n) ? WD.map((d, i) => `<div class="hbar"><div class="hbar-top"><span>${d} · ${wd[i].n} turni</span><b class="num">${wd[i].n ? eur(wdAvg[i]) : '—'}</b></div><div class="hbar-track"><i style="width:${wdAvg[i] / wdMax * 100}%;background:${i === bestWd ? 'var(--lime)' : '#4a4a4a'};animation-delay:${i * .05}s"></i></div></div>`).join('') : '<p class="c-s" style="margin-top:12px">Aggiungi qualche turno per vedere quali giorni rendono di più.</p>'}
    </section>`;
  $('#cmpA').onchange = e => { ui.cmpA = e.target.value; ui.cmpB = ui.cmpB || B; renderStats(); };
  $('#cmpB').onchange = e => { ui.cmpB = e.target.value; ui.cmpA = ui.cmpA || A; renderStats(); };
  fillPicks($('#v-stats'));
  const sc = $('#mrr'), sel = sc && sc.querySelector('.sel');
  if (sel && sc.scrollWidth > sc.clientWidth) { sc.style.scrollBehavior = 'auto'; sc.scrollLeft = sel.offsetLeft - sc.clientWidth / 2 + sel.offsetWidth / 2; sc.style.scrollBehavior = ''; }
}

  }, { passive: false });
  const end = () => {
    if (y0 == null) return; y0 = null; if (!active) return; active = false;
    document.body.classList.remove('dragging');
    el.style.transition = ''; scrim.style.transition = ''; el.style.transform = ''; scrim.style.opacity = ''; app.style.transform = ''; app.style.filter = '';
    if (dy > 120 || (vel > .45 && dy > 20)) close();
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}
dragToClose($('#sheet'), $('#scrim'), closeSheet);
dragToClose($('#picker'), $('#pkScrim'), closePicker);

// Swipe orizzontale sul contenuto per cambiare mese: il contenuto segue il dito, dal bordo arriva il mese di destinazione
let sx = null, sy = null, swLock = 0, swDir = 0, swGo = false, swView = null, swBusy = false;
const SW_TH = 90, SW_C = 2 * Math.PI * 30, msw = $('#msw'), mfl = $('#mfill');
const swReset = (anim = true) => {
  if (swView) { swView.style.transition = anim ? 'transform .55s var(--spring), opacity .3s ease' : 'none'; swView.style.transform = ''; swView.style.opacity = ''; }
  msw.style.transition = anim ? 'opacity .2s ease, transform .35s var(--spring-soft)' : 'none'; msw.style.opacity = 0; msw.classList.remove('go');
  swLock = 0; swDir = 0; swGo = false;
};
function swShow(d) {
  const ym = addMonths(ui.month, d);
  msw.className = 'msw ' + (d > 0 ? 'r' : 'l');
  msw.innerHTML = `<span class="mo"><svg class="pr" viewBox="0 0 60 60"><circle cx="30" cy="30" r="30" stroke-dasharray="${SW_C}" stroke-dashoffset="${SW_C}"/></svg>${ico(d > 0 ? 'arrow-right' : 'arrow-left')}</span><span class="lb">${monthName(ym)}<small>${ym.slice(0, 4)}</small></span>`;
}
function commitSwipe(d) {
  swBusy = true;
  const ym = addMonths(ui.month, d), mo = msw.querySelector('.mo'), r = mo ? mo.getBoundingClientRect() : null, v = swView;
  mfl.style.setProperty('--x', r ? (r.left + r.width / 2) + 'px' : (d > 0 ? '100%' : '0%'));
  mfl.style.setProperty('--y', r ? (r.top + r.height / 2) + 'px' : '50%');
  mfl.style.setProperty('--d', d);
  mfl.innerHTML = `<div class="t"><small>${d > 0 ? 'Mese successivo' : 'Mese precedente'}${ico(d > 0 ? 'arrow-right' : 'arrow-left')}</small><b>${monthName(ym)}</b><span class="yr">${ym.slice(0, 4)}</span></div>`;
  mfl.className = 'mfill on'; void mfl.offsetWidth; mfl.classList.add('grow');
  setTimeout(() => { msw.style.transition = 'none'; msw.style.opacity = 0; msw.classList.remove('go'); }, 120);
  setTimeout(() => {
    if (v) { v.style.transition = 'none'; v.style.transform = ''; v.style.opacity = ''; }
    setMonth(ym);
  }, 520);
  setTimeout(() => mfl.classList.add('out'), 1180);
  setTimeout(() => { mfl.className = 'mfill'; swBusy = false; }, 1700);
  swLock = 0; swDir = 0; swGo = false;
}
$('main').addEventListener('touchstart', e => {
  sx = null;
  if (swBusy || ui.view === 'settings' || ui.view === 'profile' || e.touches.length > 1 || e.target.closest('input,.seg,.mrr,.rng,.chips,.wk-cols')) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swLock = 0; swView = $('#v-' + ui.view);
}, { passive: true });
$('main').addEventListener('touchmove', e => {
  if (sx == null) return;
  const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
  if (!swLock) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sx = null; return; }
    if (Math.abs(dx) < 14 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    swLock = 1; swView.style.transition = 'none'; msw.style.transition = 'none';
  }
  const d = dx < 0 ? 1 : -1, p = Math.min(1, Math.abs(dx) / SW_TH);
  if (d !== swDir) { swDir = d; swGo = false; swShow(d); }
  const over = Math.max(0, Math.abs(dx) - SW_TH), off = Math.sign(dx) * (Math.min(Math.abs(dx), SW_TH) * .45 + over * .15);
  swView.style.transform = `translateX(${off}px)`; swView.style.opacity = 1 - p * .3;
  msw.style.opacity = Math.min(1, p * 1.5); msw.style.transform = `translate(${(1 - p) * 50 * d}px,-50%) scale(${.85 + p * .15})`;
  msw.querySelector('circle').style.strokeDashoffset = SW_C * (1 - p);
  const go = p >= 1; if (go !== swGo) { swGo = go; msw.classList.toggle('go', go); if (go && navigator.vibrate) navigator.vibrate(8); }
}, { passive: true });
$('main').addEventListener('touchend', () => {
  sx = null;
  if (!swLock) return;
  if (swGo) commitSwipe(swDir); else swReset();
}, { passive: true });
$('main').addEventListener('touchcancel', () => { sx = null; if (swLock) swReset(); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.view === 'home') renderHome(); });

render();
handleAuthRedirect(); if (session) syncNow();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
