<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turnix">
<meta name="description" content="Turnix: stima in anticipo quanto guadagni da ogni turno. Lordo, netto, mance e TFR.">
<title>Turnix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Turnix v3 — linguaggio visivo: nero profondo, colori pieni (lime, rosa,
   verde bosco, bianco), titoli leggeri su due toni, forme molto arrotondate.
   ===================================================================== */
:root{
  --bg:#0b0b0b; --s1:#161616; --s2:#1f1f1f; --s3:#2a2a2a; --line:rgba(255,255,255,.08);
  --tx:#fff; --mu:#8a8a8a; --di:#5c5c5c; --two:#6e6e6e;
  --lime:#eef230; --lime2:#f6f89c; --pink:#ffc6f0; --green:#075d44; --green2:#0c7d5b; --ink:#0d0d0d;
  --r:32px; --nav:74px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.22,1,.36,1); --ease-sheet:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
/* niente barre di scorrimento visibili: aspetto da app */
html,body,*{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
body{margin:0;overflow-x:clip;color:var(--tx);font-family:'Urbanist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;flex:none;fill:currentColor;display:inline-block;vertical-align:-.14em}
.app{max-width:520px;margin:0 auto;padding:calc(var(--st) + 12px) 18px calc(var(--nav) + var(--sb) + 44px)}

/* ---------- Header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);font-size:21px;font-weight:600;letter-spacing:-.02em}
.logo{width:38px;height:38px;display:block}
.logo .coin{transform-box:fill-box;transform-origin:center;animation:coinIn .8s cubic-bezier(.3,1.4,.5,1) .1s both,coinFlip 7s ease-in-out 2s infinite}
.logo .shine{animation:shine 7s ease-in-out 2s infinite;opacity:0}
@keyframes coinIn{from{transform:scale(.4) rotate(-90deg);opacity:0}}
@keyframes coinFlip{0%,80%,100%{transform:scaleX(1)}87%{transform:scaleX(.06)}94%{transform:scaleX(1)}}
@keyframes shine{0%,92%,100%{opacity:0}96%{opacity:.9}}
.hdr-r{display:flex;gap:8px;align-items:center}
.circ{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx);flex:none;transition:transform .14s ease,background-color .2s}
.circ:active{transform:scale(.92)}
.circ .ic{width:22px;height:22px}
.circ.lime{background:var(--lime);color:var(--ink)}
.circ.l2{width:50px;height:50px;background:var(--lime2);color:var(--ink)}
.circ.wh{width:50px;height:50px;background:rgba(255,255,255,.7);color:var(--ink)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--pink);color:var(--ink);display:grid;place-items:center;font-size:23px;font-weight:700;overflow:hidden;flex:none;transition:transform .14s ease}
.avatar:active{transform:scale(.93)}
.avatar.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ic{width:24px;height:24px}
.avatar.av-xl{width:112px;height:112px;font-size:44px;cursor:default;margin:0 auto}
.avatar.av-xl .ic{width:44px;height:44px}
.prof{text-align:center;padding:26px 20px 22px}
.prof h2{margin:14px 0 2px;font-size:28px;font-weight:500;letter-spacing:-.02em}
.prof p{margin:0;color:var(--mu);font-size:13.5px;font-weight:500}
.prof-b{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.prof-b .btn{height:44px;font-size:14px;padding:0 18px}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;color:#fff}
.lrow:last-child{border-bottom:0}
.lrow .li{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.lrow .li .ic{width:20px;height:20px}
.lrow small{display:block;color:var(--mu);font-size:12.5px;font-weight:500;margin-top:1px}
.lrow .lt{flex:1;min-width:0}
.lrow .ic.chev{transform:rotate(-90deg);color:var(--di)}
.lrow[disabled]{cursor:default}
.lrow[disabled] .lt{opacity:.55}
.soon{height:24px;padding:0 10px;border-radius:999px;background:var(--s3);color:var(--mu);font-size:11px;font-weight:700;display:grid;place-items:center;letter-spacing:.03em;flex:none}
.lrow.danger{color:var(--pink)}
.lrow.danger .li{color:var(--pink)}
.dpill{height:56px;padding:0 20px;border-radius:999px;background:var(--s2);display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;transition:transform .14s ease}
.dpill:active{transform:scale(.96)}
.dpill .ic{width:19px;height:19px}
.dpill .st{width:7px;height:7px;border-radius:50%;background:var(--di)}
.dpill .st.current{background:var(--lime);box-shadow:0 0 0 4px rgba(238,242,48,.15)}
.dpill .st.future{background:transparent;box-shadow:inset 0 0 0 1.5px #fff}
.dpill[aria-expanded="true"]{background:var(--s3)}

/* ---------- Tipografia ---------- */
.title{font-size:46px;line-height:1.02;font-weight:400;letter-spacing:-.03em;margin:0 0 24px}
.title span,.h2 span,.sheet-h h2 span{color:var(--two)}
.h2{font-size:28px;font-weight:400;letter-spacing:-.025em;margin:0;line-height:1.08}
.big{font-size:46px;font-weight:500;letter-spacing:-.035em;line-height:1}
.big .cents{font-size:.6em;opacity:.55;letter-spacing:-.01em}

/* ---------- Card ---------- */
.card{border-radius:var(--r);padding:22px;margin-bottom:12px;background:var(--s1);position:relative;overflow:hidden}
.c-grad{background:linear-gradient(180deg,var(--pink) 0%,#f9d9cf 42%,var(--lime) 100%);color:var(--ink)}
.c-green{background:var(--green);color:#fff}
.c-lime{background:var(--lime);color:var(--ink)}
.c-pink{background:var(--pink);color:var(--ink)}
.c-white{background:#fff;color:var(--ink)}
.c-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.c-t{font-size:17px;font-weight:500;margin:0;letter-spacing:-.01em}
.c-s{font-size:13px;opacity:.6;margin:3px 0 0;font-weight:500}
.card:not([class*="c-"]) .c-s{color:var(--mu);opacity:1}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;font-weight:500}
.lg.col{flex-direction:column;align-items:flex-start;gap:3px}
.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* badge a stella */
.callout{display:flex;margin:16px 0 4px}
.cv{position:relative;display:inline-flex;align-items:center}
.bw{position:absolute;left:-36px;top:50%;width:86px;height:86px;margin-top:-43px}
.burst{display:block;width:100%;height:100%;animation:spinIn .8s var(--ease) both}
@keyframes spinIn{from{transform:rotate(-70deg) scale(.5);opacity:0}}
.cv .big{position:relative;z-index:1}
.cv.flip .bw{left:auto;right:-36px}

/* barre settimanali (home) */
.wk{display:flex;gap:10px;margin-top:14px;height:186px}
.wk-y{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;opacity:.55;padding:0 0 24px;font-weight:600;min-width:34px}
.wk-cols{position:relative;flex:1;display:flex;justify-content:space-around;gap:8px}
.wk-col{position:relative;flex:1;max-width:58px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;cursor:pointer}
.wk-col:active .wb{transform:scaleY(.96)}
.wk-col small{height:24px;line-height:24px;font-size:11px;opacity:.6;font-weight:600;white-space:nowrap}
.wb{display:block;border-radius:3px;transform-origin:bottom;animation:growY .6s var(--ease) both}
.wb.done,.wb.now{background:var(--ink)}
.wk-col.sel .wb{background:repeating-linear-gradient(-45deg,var(--ink) 0 1.4px,transparent 1.4px 7px),#fff;border:1.5px solid var(--ink)}
.wk-col.sel small{opacity:1;font-weight:800}
.wb{transition:background-color .2s}
.wb.plan{background:#fff}
.wb.zero{background:rgba(0,0,0,.14);border:0}
.lead{position:absolute;top:14px;width:1.5px;margin-left:-.75px;background:var(--ink);transition:left .4s var(--ease),bottom .4s var(--ease)}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip-b{height:36px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.chip-b .ic{width:16px;height:16px;color:var(--lime)}
.chip-b.w{background:rgba(255,255,255,.6);color:var(--ink)}

/* card verde "in tasca" */
.bal{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bal .v{font-size:30px;font-weight:500;letter-spacing:-.03em}
.spark{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.spark text{font-family:inherit;font-size:10px;fill:rgba(255,255,255,.55);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini div{background:rgba(255,255,255,.09);border-radius:20px;padding:11px 13px;font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}
.mini b{display:block;font-size:17px;font-weight:600;color:#fff;margin-top:2px;letter-spacing:-.01em}

/* simulatore */
.stp{display:flex;align-items:center;justify-content:space-between;height:56px;border-radius:999px;background:var(--s2);padding:0 6px}
.stp button{width:44px;height:44px;border-radius:50%;background:var(--s3);font-size:22px;font-weight:500;display:grid;place-items:center;transition:transform .14s}
.stp button:active{transform:scale(.9)}
.stp output{font-size:17px;font-weight:600}
.sim-out{display:flex;gap:8px;margin-top:12px}
.so-l{flex:1.7;background:var(--lime);color:var(--ink);border-radius:24px;padding:16px 18px}
.so-l b{display:block;font-size:34px;font-weight:500;letter-spacing:-.03em;margin-top:4px;line-height:1}
.so-r{flex:1;background:#fff;color:var(--ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.so-r b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sim-out small{font-size:12px;font-weight:600;opacity:.6}

/* segmenti a pillola */
.seg{display:flex;gap:4px;background:var(--s2);padding:5px;border-radius:999px}
.seg button{flex:1;height:44px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mu);transition:background-color .2s,color .2s,transform .14s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:#fff;color:var(--ink)}
.seg.types button.on[data-t="domenica"]{background:var(--lime)}
.seg.types button.on[data-t="festivo"]{background:var(--pink)}

/* liste turni */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 12px}
.sec-h h3{margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em}
.sec-h h3 span{color:var(--two)}
.link{color:var(--mu);font-size:13.5px;font-weight:600}
.srow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:9px 16px 9px 9px;border-radius:999px;background:var(--s1);margin-bottom:8px;transition:transform .14s ease,background-color .2s}
.srow:active{transform:scale(.98);background:var(--s2)}
.sd{width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:var(--ink);line-height:1;background:#fff}
.sd b{font-size:19px;font-weight:700}
.sd span{font-size:10px;font-weight:700;text-transform:uppercase;margin-top:3px;opacity:.65;letter-spacing:.04em}
.sd.domenica{background:var(--lime)}.sd.festivo{background:var(--pink)}
.sd.pln{background:transparent;color:#fff;outline:1.6px dashed rgba(255,255,255,.7);outline-offset:-2px}
.sd.pln.domenica{color:var(--lime);outline-color:var(--lime)}
.sd.pln.festivo{color:var(--pink);outline-color:var(--pink)}
.srow.pl .stime{opacity:.85}
.srow.due .sd.pln{outline-color:var(--lime);color:var(--lime)}
.sv-pl{color:var(--mu);display:grid;place-items:center;padding-right:4px}
.sv-pl .ic{width:20px;height:20px}
.sv-cf{background:var(--lime);color:var(--ink);font-size:13px;font-weight:700;border-radius:99px;padding:8px 13px;flex:none}
.cf-hint{margin:-6px 0 12px!important}
.cf-note{display:flex;gap:10px;align-items:flex-start;background:rgba(214,240,40,.1);color:var(--lime);border-radius:20px;padding:12px 14px;font-size:13.5px;font-weight:600;margin:0 0 16px;line-height:1.35}
.cf-note .ic{width:18px;height:18px;flex:none;margin-top:1px}
.preview.plan{background:transparent;color:#fff;outline:1.6px dashed rgba(255,255,255,.55);outline-offset:-2px}
.preview.plan .pv-r b{font-size:17px}
.btn.nf{flex:none;padding:0 18px;font-size:14.5px}
.sd.plan{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.sd.plan.domenica{color:var(--lime);box-shadow:inset 0 0 0 1.5px var(--lime)}
.sd.plan.festivo{color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--pink)}
.sm{flex:1;min-width:0}
.stime{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.smeta{display:block;font-size:12.5px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sv{text-align:right;flex:none}
.sv b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sv span{font-size:12px;color:var(--lime);font-weight:600}
.sv span.muted{color:var(--di)}
.grp{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:20px 8px 9px;display:flex;justify-content:space-between}
.empty{background:var(--s1);border-radius:28px;padding:30px 22px;text-align:center;color:var(--mu);font-size:14px;font-weight:500}
.empty b{display:block;color:#fff;font-size:18px;margin-bottom:4px;font-weight:600}
.empty .ic{display:block;width:40px;height:40px;margin:0 auto 12px;color:var(--lime)}

/* cedolino (pannello bianco) */
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.card>summary::-webkit-details-marker{display:none}
.chev{width:20px;height:20px;transition:transform .45s var(--ease-sheet)}
details[open]:not(.closing) .chev{transform:rotate(180deg)}
details.card .pbody{overflow:hidden}
details.card .pin{padding-top:12px}
details.card>summary:active .c-t{opacity:.7}
.prow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:14px;font-weight:500}
.prow.sub{padding-left:12px;font-size:13px;opacity:.65}
.prow.tot{font-weight:700;font-size:15.5px;border-bottom:1.5px solid var(--ink)}
.prow small{opacity:.6;font-weight:500}
.prow:last-child{border-bottom:0}
.prow .hl{background:var(--lime);padding:2px 8px;border-radius:999px}

/* calendario turni */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px}
.cal-h{text-align:center;font-size:11.5px;color:var(--mu);font-weight:700;padding-bottom:4px}
.cal-h:last-child{color:var(--pink)}
.cal-d{width:100%;max-width:46px;aspect-ratio:1;margin:0 auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;line-height:1.05;transition:transform .14s ease}
.cal-d:active{transform:scale(.88)}
.cal-d small{font-size:9px;font-weight:700;opacity:.7}
.cal-d.out{visibility:hidden}
.cal-d.hol{color:var(--pink)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px #fff}
.cal-d.t-normale{background:#fff;color:var(--ink)}
.cal-d.t-domenica{background:var(--lime);color:var(--ink)}
.cal-d.t-festivo{background:var(--pink);color:var(--ink)}
.cal-d.pln{background:transparent!important;color:#fff;box-shadow:none;outline:1.6px dashed rgba(255,255,255,.75);outline-offset:-2px}
.cal-d.pln.t-domenica{color:var(--lime);outline-color:var(--lime)}
.cal-d.pln.t-festivo{color:var(--pink);outline-color:var(--pink)}
.cal-d.pln.due{outline-color:var(--lime);color:var(--lime)}
.cal-d.fut{background:transparent!important;color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
.cal-d.fut.t-domenica{color:var(--lime);box-shadow:inset 0 0 0 1.5px var(--lime)}
.cal-d.fut.t-festivo{color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--pink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tile{border-radius:26px;padding:15px 16px;color:var(--ink)}
.tile small{font-size:12px;font-weight:600;opacity:.6}
.tile b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.tile.l{background:var(--lime)}.tile.p{background:var(--pink)}.tile.w{background:#fff}

/* analisi: barre a blocchi impilati */
.rng{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.rng button{height:40px;padding:0 17px;border-radius:999px;background:var(--s2);font-size:13.5px;font-weight:600;color:var(--mu);transition:background-color .2s,color .2s}
.rng button.on{background:#fff;color:var(--ink)}
.mrr{display:flex;justify-content:space-between;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:84px 18px 4px;scroll-behavior:smooth}
.mrr::-webkit-scrollbar{display:none}
.mcol{position:relative;flex:1 0 54px;max-width:84px;display:flex;flex-direction:column;gap:5px;text-align:left}
.mstack{height:210px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;position:relative}
.mb{display:block;border-radius:5px;transform-origin:bottom;animation:growY .6s var(--ease) both}
.mb.pk{background:var(--pink);border:1px solid #d99ccb}
.mb.lm{background:var(--lime);border:1px solid #b7bb14}
.mb.gr{background:var(--green);border:1px solid #2c9672}
.mb.gr.hatch{background:repeating-linear-gradient(-45deg,#2c9672 0 1.4px,transparent 1.4px 7px),#05402f}
.mhrs{height:28px;border-radius:5px;background:#fff;color:var(--ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.mcol small{font-size:11.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.mcol.sel small{color:#fff}
.mcol.fut .mb,.mcol.fut .mhrs{opacity:.4}
.mtag{position:absolute;left:calc(50% - 28px);display:flex;align-items:center;white-space:nowrap;z-index:2;pointer-events:none}
.mtag.r{left:auto;right:calc(50% - 28px);flex-direction:row-reverse}
.mtag .burst{width:56px;height:56px;flex:none}
.mtag b{font-size:28px;font-weight:500;letter-spacing:-.03em;margin:0 0 0 -12px;position:relative}
.mtag.r b{margin:0 -12px 0 0}
.mlead{position:absolute;left:50%;width:1.5px;height:30px;background:#fff;opacity:.85}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 12px}
.kc{background:var(--s1);border-radius:22px;padding:12px 14px;font-size:12px;color:var(--mu);font-weight:600}
.kc b{display:block;color:#fff;font-size:18px;font-weight:600;margin-top:2px;letter-spacing:-.02em;white-space:nowrap}

/* analisi: anello (card lime) */
.run{border-radius:40px;padding:16px 16px 16px}
.run-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.run-h h3{font-size:19px;font-weight:500;margin:0;text-align:center}
.ring{display:block;width:100%;max-width:330px;margin:4px auto 0;animation:ringIn .8s var(--ease) both}
@keyframes ringIn{from{transform:rotate(-35deg) scale(.88);opacity:0}}
.ring text{font-family:inherit}
.run-lg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 14px}
.run-lg span{display:flex;align-items:center;gap:8px;background:rgba(13,13,13,.07);border-radius:16px;padding:9px 12px;font-size:13px;font-weight:600;min-width:0}
.run-lg span.off{opacity:.45}
.run-lg i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(13,13,13,.18)}
.run-lg b{margin-left:auto;font-size:15px;font-weight:600;white-space:nowrap}
.wpanel{background:#fff;border-radius:32px;padding:22px 20px 18px;color:var(--ink)}
.wpanel h4{margin:0 0 16px;font-size:16px;font-weight:500}
.blocks{display:flex;gap:8px}
.blk{display:flex;flex-direction:column;align-items:center;min-width:76px}
.blk .bx{width:100%;height:78px;border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:600}
.blk.l .bx{background:var(--lime)}
.blk.k .bx{background:var(--ink);color:#fff}
.blk i{width:1.5px;height:30px;background:var(--ink)}
.blk b{font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:6px}
.wp-s{font-size:12.5px;opacity:.55;margin:12px 0 0;text-align:center;font-weight:500}

/* obiettivo (card rosa) */
.gauge{display:block;width:100%;margin-top:6px}
.p1{font-size:.62em;font-weight:700;color:var(--lime);margin-left:3px;vertical-align:super;line-height:0}
.nd{display:none;background:var(--lime);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.nd.on{display:inline-block}
.ovn{display:none;gap:10px;align-items:flex-start;background:rgba(214,240,40,.1);color:#fff;border-radius:20px;padding:12px 14px;font-size:13.5px;font-weight:500;margin:-4px 0 16px;line-height:1.4}
.ovn.on{display:flex}
.ovn b{color:var(--lime);font-weight:700}
.ovn .ic{width:18px;height:18px;flex:none;margin-top:1px;color:var(--lime)}
.pk-nd{font-size:13px;font-weight:600;color:var(--mu);margin-top:4px}
.pk-nd.on{color:var(--lime)}
.gl-msg{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px auto 0;width:fit-content;background:rgba(13,13,13,.08);border-radius:99px;padding:10px 16px;font-size:14.5px;font-weight:600}
.gl-msg.ok{background:var(--ink);color:var(--pink)}
.gl-msg .ic{width:18px;height:18px}
.gl-msg b{font-weight:700}
.gl-sh{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gl-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.gl-dots i{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.gl-dots i.p{background:none;box-shadow:inset 0 0 0 1.6px var(--ink)}
.gl-sh small{font-size:12.5px;font-weight:600;opacity:.6}
.gauge text{font-family:inherit}

/* confronto & grafici */
.cmp-sel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin:14px 0 8px}
.cmp-sel .pick{height:50px;padding:0 12px;gap:7px;font-size:14.5px;justify-content:center;min-width:0}
.cmp-sel .pick .pick-v{flex:0 1 auto}
.cmp-sel .pick .ic{width:17px;height:17px}
@media (max-width:360px){.cmp-sel .pick .ic{display:none}}
.vs{font-size:12px;font-weight:700;color:var(--mu)}
.cmp-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}
.cmp-row:last-child{border-bottom:0}
.cmp-row span{color:var(--mu)}
.cmp-row b{font-weight:600;text-align:right}
.cmp-row b.m{color:var(--mu)}
.delta{justify-self:end;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;display:grid;place-items:center;background:var(--s3);color:var(--mu)}
.delta.up{background:var(--lime);color:var(--ink)}
.delta.down{background:var(--pink);color:var(--ink)}
.chart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.chart text{font-family:inherit;font-size:10.5px;fill:var(--mu);font-weight:600}
@keyframes draw{to{stroke-dashoffset:0}}
.hbar{margin-top:14px}
.hbar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:7px;color:var(--mu);font-weight:500}
.hbar-top b{color:#fff;font-weight:600}
.hbar-track{height:12px;border-radius:99px;background:var(--s3);overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:growX .7s var(--ease) both}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:12.5px;font-weight:700;flex:none}
.pill .ic{width:13px;height:13px}

/* ---------- Form ---------- */
.sect{background:var(--s1);border-radius:var(--r);padding:22px 18px;margin-bottom:12px}
.sect-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:0 4px 16px;display:flex;align-items:center;gap:8px}
.sect-t .ic{width:16px;height:16px;color:var(--lime)}
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-size:13px;color:var(--mu);font-weight:600;margin:0 0 7px 6px}
.input{width:100%;height:56px;border-radius:999px;background:var(--s2);border:1.5px solid transparent;padding:0 20px;font-size:16px;font-weight:600;outline:none;color:#fff;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--lime)}
.input::placeholder{color:var(--di);font-weight:500}
.input-wrap{position:relative}
.input-wrap .unit{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--di);font-weight:700;pointer-events:none}
.input-wrap .input{padding-right:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .input{padding:0 14px}.grid3 .input-wrap .input{padding-right:30px}.grid3 .input-wrap .unit{right:14px}
.hint{font-size:12.5px;color:var(--mu);margin:2px 6px 0;line-height:1.5;font-weight:500}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 6px}
.toggle b{font-size:14.5px;font-weight:600}
.toggle small{display:block;color:var(--mu);font-size:12.5px;font-weight:500}
.sw{width:56px;height:34px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background-color .25s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s var(--ease),background-color .25s}
.sw.on{background:var(--lime)}
.sw.on::after{transform:translateX(22px);background:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:58px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px;transition:transform .14s ease}
.btn:active{transform:scale(.97)}
.btn .ic{width:20px;height:20px}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-ghost{background:var(--s2);color:#fff}
.btn-danger{background:transparent;color:var(--pink);box-shadow:inset 0 0 0 1.5px rgba(255,198,240,.5)}
.btn-block{width:100%}
.foot{text-align:center;color:var(--di);font-size:12px;margin:22px 14px 0;line-height:1.6;font-weight:500}

/* ---------- Nav a pillola ---------- */
.nav{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:8px;border-radius:999px;
  background:rgba(32,32,32,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.nav-b{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.nav-b .ic{width:24px;height:24px}
.nav-b.on{color:var(--ink);background:#fff;animation:navPop .38s var(--ease)}
@keyframes navPop{from{transform:scale(.6);background:rgba(255,255,255,0)}}

/* ---------- Sheet, dialog, toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .28s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:50;width:100%;max-width:520px;max-height:93dvh;overflow-y:auto;overscroll-behavior:contain;
  transform:translate(-50%,105%);transition:transform .42s var(--ease-sheet);background:#121212;border-radius:38px 38px 0 0;padding:10px 18px calc(20px + var(--sb));box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:#3a3a3a;margin:0 auto 14px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -60px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.sheet-h h2{margin:0;font-size:38px;font-weight:400;line-height:1.02;letter-spacing:-.03em}
.preview{border-radius:30px;background:var(--lime);color:var(--ink);padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.pv-l{font-size:13px;font-weight:600;opacity:.6}
.pv-v{font-size:40px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.pv-r{text-align:right;font-size:12.5px;line-height:1.75;font-weight:500}
.pv-r b{font-weight:700}
.holiday-note{font-size:13px;color:var(--pink);font-weight:600;margin:-6px 6px 12px;display:flex;align-items:center;gap:6px}
.holiday-note .ic{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{height:40px;padding:0 16px;border-radius:999px;background:var(--s2);font-size:13.5px;font-weight:600;color:#ddd;transition:transform .14s,background-color .2s}
.chip:active{transform:scale(.95);background:var(--s3)}
.sheet-actions{display:flex;gap:10px;margin-top:10px}
.sheet-actions .btn-lime{flex:1}
.del{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--pink);box-shadow:inset 0 0 0 1.5px rgba(255,198,240,.5);flex:none;transition:transform .14s}
.del:active{transform:scale(.93)}
.del .ic{width:22px;height:22px}
.dialog{position:fixed;left:50%;top:50%;z-index:60;width:calc(100% - 40px);max-width:370px;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .24s var(--ease);background:#161616;border-radius:34px;padding:26px 20px 20px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 8px 4px;font-size:25px;font-weight:500;letter-spacing:-.02em}
.dialog p{margin:0 4px 20px;color:var(--mu);font-size:14.5px;font-weight:500}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 36px);z-index:70;transform:translate(-50%,16px);opacity:0;transition:opacity .2s ease,transform .3s var(--ease);
  background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:14px 22px;border-radius:999px;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Picker ---------- */
.pick{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.pick .ic{width:19px;height:19px;color:var(--lime)}
.pick .pick-v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pick-v.ph{color:var(--di)}
.pick .chev{color:var(--mu)}
.pick.time{font-size:18px}
.pick[aria-expanded="true"]{border-color:var(--lime)}
.dpill .pick-v{flex:none}
.pk-scrim{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s ease}
.pk-scrim.on{opacity:1;pointer-events:auto}
.picker{position:fixed;left:50%;bottom:0;z-index:65;width:100%;max-width:520px;transform:translate(-50%,105%);transition:transform .4s var(--ease-sheet);
  border-radius:38px 38px 0 0;padding:10px 18px calc(20px + var(--sb));background:#171717;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.picker.on{transform:translate(-50%,0)}
.pk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 4px 16px}
.pk-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pk-big{font-size:32px;font-weight:500;letter-spacing:-.03em;margin-top:2px}
.pk-nav{display:flex;gap:8px}
.pk-nav button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--s3);transition:transform .14s}
.pk-nav button:active{transform:scale(.92)}
.pk-nav .ic{width:18px;height:18px}
.pk-foot{display:flex;gap:10px;margin-top:16px}
.pk-foot .btn{flex:1}
.pk-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.pk-wd span{text-align:center;font-size:11.5px;font-weight:700;color:var(--mu)}
.pk-wd span:last-child{color:var(--pink)}
.pk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0}
.pk-day{position:relative;width:46px;height:46px;margin:0 auto;border-radius:50%;font-weight:600;font-size:15.5px;display:grid;place-items:center;transition:transform .14s ease,background-color .18s}
.pk-day:active{transform:scale(.88)}
.pk-day.out{visibility:hidden}
.pk-day.sun,.pk-day.hol{color:var(--pink)}
.pk-day.today{box-shadow:inset 0 0 0 1.5px #fff}
.pk-day.has::after{content:'';position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lime)}
.pk-day.sel{background:var(--lime);color:var(--ink);box-shadow:none}
.pk-day.sel::after{background:var(--ink)}
.pk-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--mu);font-weight:600}
.pk-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pk-wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:230px;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.pk-band{position:absolute;left:0;right:0;top:50%;height:50px;margin-top:-25px;border-radius:999px;background:var(--s2);pointer-events:none}
.pk-wheel{position:relative;width:96px;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:90px 0;overscroll-behavior:contain}
.pk-wheel::-webkit-scrollbar{display:none}
.pk-wheel button{display:block;width:100%;height:50px;scroll-snap-align:center;font-size:28px;font-weight:500;color:var(--di);transition:color .15s,transform .15s}
.pk-wheel button.cur{color:#fff;transform:scale(1.08)}
.pk-colon{font-size:28px;font-weight:700;color:var(--lime);position:relative;z-index:1}
.pk-months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk-months button{height:56px;border-radius:999px;background:var(--s2);font-weight:600;font-size:15px;transition:transform .14s,background-color .18s}
.pk-months button:active{transform:scale(.95)}
.pk-months button.has{color:var(--lime)}
.pk-months button.now{box-shadow:inset 0 0 0 1.5px #fff}
.pk-months button.sel{background:var(--lime);color:var(--ink);box-shadow:none}
.pk-list{display:flex;flex-direction:column;gap:8px}
.pk-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:26px;background:var(--s2);transition:transform .14s ease,background-color .18s}
.pk-opt:active{transform:scale(.98)}
.pk-opt b{display:block;font-size:16px;font-weight:600}
.pk-opt small{display:block;opacity:.6;font-size:13px;margin-top:2px;font-weight:500}
.pk-radio{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px #555;display:grid;place-items:center}
.pk-opt.sel{background:var(--lime);color:var(--ink)}
.pk-opt.sel .pk-radio{box-shadow:inset 0 0 0 2px var(--ink)}
.pk-opt.sel .pk-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--ink)}

/* ---------- Movimento ---------- */
.view{display:none;animation:vFade .25s ease-out}
.view.active{display:block}
.view.slide-next{animation:vNext .34s var(--ease)}
.view.slide-prev{animation:vPrev .34s var(--ease)}
@keyframes vFade{from{opacity:0}}
@keyframes vNext{from{opacity:0;transform:translate3d(24px,0,0)}}
@keyframes vPrev{from{opacity:0;transform:translate3d(-24px,0,0)}}
.view.quiet .wb,.view.quiet .mb,.view.quiet .hbar-track i,.view.quiet .ring,.view.quiet .burst{animation:none}
.view.quiet path[pathLength]{animation:none!important;stroke-dashoffset:0!important}
/* =================== Movimento stile iOS =================== */
:root{--spring:cubic-bezier(.2,1.25,.35,1);--spring-soft:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.45,0,.8,.5)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,0.0348,0.1209,0.2355,0.3616,0.4872,0.6042,0.7079,0.7959,0.8678,0.9243,0.9669,0.9974,1.0178,1.0303,1.0366,1.0384,1.0371,1.0338,1.0295,1.0246,1.0198,1.0153,1.0113,1.0079,1.0051,1.0029,1.0013,1.0001,0.9993,0.9988,0.9986,0.9985,0.9986,0.9987,0.9989,0.9991,0.9992,0.9994,0.9996,0.9997,0.9998,0.9999,0.9999,1,1,1);--spring-soft:linear(0,0.0205,0.0711,0.1394,0.2164,0.2962,0.3747,0.4494,0.5188,0.5821,0.639,0.6897,0.7343,0.7733,0.8073,0.8366,0.8618,0.8834,0.9018,0.9175,0.9308,0.9421,0.9516,0.9596,0.9663,0.9719,0.9767,0.9806,0.9839,0.9866,0.9889,0.9908,0.9924,0.9937,0.9948,0.9957,0.9965,0.9971,0.9976,0.998,0.9984,0.9987,0.9989,0.9991,0.9993,0.9994,1)}}

/* tocco: si comprime subito, torna elastico al rilascio */
.circ,.avatar,.dpill,.btn,.chip,.srow,.cal-d,.pk-day,.pk-months button,.pk-opt,.seg button,.rng button,.stp button,.lrow,.del,.pk-nav button,.nav-b,.wk-col,.mcol,.pick{
  transition:transform .6s var(--spring),background-color .25s ease,color .25s ease,box-shadow .25s ease,border-color .25s ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.circ:active,.avatar:active,.pk-nav button:active,.stp button:active,.del:active,.nav-b:active{transform:scale(.88);transition-duration:.1s;transition-timing-function:ease-out}
.dpill:active,.btn:active,.chip:active,.seg button:active,.rng button:active,.pk-months button:active,.cal-d:active,.pk-day:active,.wk-col:active{transform:scale(.93);transition-duration:.1s;transition-timing-function:ease-out}
.srow:active,.pk-opt:active,.lrow:active,.mcol:active,.pick:active{transform:scale(.97);transition-duration:.1s;transition-timing-function:ease-out}
.lrow[disabled]:active{transform:none}

/* ingresso delle schermate: cascata morbida, elemento per elemento */
.view,.view.slide-next,.view.slide-prev{animation:none}
.view.enter>*{animation:riseIn .7s var(--spring-soft) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.view.slide-next>*{animation:slideR .6s var(--spring-soft) backwards;animation-delay:calc(var(--i,0) * 26ms)}
.view.slide-prev>*{animation:slideL .6s var(--spring-soft) backwards;animation-delay:calc(var(--i,0) * 26ms)}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,22px,0) scale(.98)}}
@keyframes slideR{from{opacity:0;transform:translate3d(32px,0,0)}}
@keyframes slideL{from{opacity:0;transform:translate3d(-32px,0,0)}}

/* grafici */
.wb{animation-duration:.8s;animation-timing-function:var(--spring-soft)}
.mb{animation:none}
.mstack{animation:fillUp 1s var(--spring-soft) both}
@keyframes fillUp{from{clip-path:inset(100% -140px 0 -140px)}to{clip-path:inset(-240px -140px 0 -140px)}}
.view.quiet .mstack{animation:none}
.hbar-track i{animation-duration:.9s;animation-timing-function:var(--spring-soft)}
.ring{animation:ringIn 1.1s var(--spring-soft) both}
.burst{animation:spinIn .95s var(--spring) both}
.lead{transition:left .6s var(--spring),bottom .6s var(--spring);transform-origin:50% 100%;animation:leadIn .55s var(--spring-soft) .5s backwards}
@keyframes leadIn{from{opacity:0;transform:scaleY(0)}}
.view.quiet .lead{animation:none}
.chev{transition:transform .5s var(--spring)}
.wk-col.pulse .wb{animation:selPop .6s var(--spring) both}
@keyframes selPop{from{transform:scaleY(.86)}}
.cv.swap{animation:cvIn .55s var(--spring) both}
.cv.swap .burst{animation-name:spinIn2}
@keyframes cvIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.95)}}
@keyframes spinIn2{from{transform:rotate(-70deg) scale(.5);opacity:0}}

/* segmented control con "cursore" che scivola (come iOS) */
.seg{position:relative}
.seg::before{content:'';position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;background:#fff;pointer-events:none;
  width:calc((100% - 10px - (var(--n,1) - 1) * 4px) / var(--n,1));transform:translateX(calc(var(--i,0) * (100% + 4px)));opacity:var(--has,0);
  transition:transform .6s var(--spring),background-color .3s ease}
.seg button{position:relative;z-index:1}
.seg button.on,.seg.types button.on[data-t]{background:transparent;color:var(--ink)}
.seg.types[data-sel="domenica"]::before{background:var(--lime)}
.seg.types[data-sel="festivo"]::before{background:var(--pink)}

/* interruttore: pomello elastico che si allarga alla pressione */
.sw{transition:background-color .3s ease}
.sw::after{transition:transform .55s var(--spring),width .3s var(--spring),background-color .3s ease}
.sw:active::after{width:32px}
.sw.on:active::after{transform:translateX(16px)}

/* menu */
.nav{transition:transform .55s var(--spring)}
.nav-b.on{animation:navPop .6s var(--spring)}

/* pannelli dal basso: apertura a molla, chiusura rapida; lo sfondo arretra come su iPhone */
.scrim,.pk-scrim{transition:opacity .45s ease}
.sheet,.picker{transition:transform .36s var(--ease-in);transform-origin:50% 0}
.sheet.on,.picker.on{transition:transform .65s var(--spring)}
.sheet{box-shadow:0 -20px 60px rgba(0,0,0,.6),0 60px 0 #121212}
.picker{box-shadow:0 -20px 60px rgba(0,0,0,.6),0 60px 0 #171717}
.app{transition:transform .5s var(--spring-soft),filter .5s ease}
body.modal .app{transform:scale(.94);filter:brightness(.8);transition:transform .65s var(--spring-soft),filter .5s ease}
body.modal .nav{transform:translate(-50%,160%)}
body.pk-open .sheet.on{transform:translate(-50%,0) scale(.95)}
body.dragging .app,body.dragging .nav{transition:none}
html{background:#000}
.pk-days.in-r,.pk-months.in-r{animation:slideR .5s var(--spring-soft)}
.pk-days.in-l,.pk-months.in-l{animation:slideL .5s var(--spring-soft)}
.pk-day.sel,.pk-months button.sel,.pk-opt.sel{animation:selPop2 .5s var(--spring)}
@keyframes selPop2{from{transform:scale(.82)}}

/* dialog e toast "dynamic island" */
.dialog{transform:translate(-50%,-50%) scale(.9);transition:opacity .2s ease,transform .3s var(--ease-in)}
.dialog.on{transform:translate(-50%,-50%) scale(1);transition:opacity .25s ease,transform .6s var(--spring)}
.toast{top:calc(var(--st) + 14px);bottom:auto;transform:translate(-50%,-150%) scale(.8);transition:transform .4s var(--ease-in),opacity .3s ease}
.toast.on{transform:translate(-50%,0) scale(1);transition:transform .65s var(--spring),opacity .2s ease}

/* swipe tra i mesi */
.msw{position:fixed;top:50%;z-index:30;display:flex;align-items:center;gap:10px;pointer-events:none;opacity:0;transform:translateY(-50%)}
.msw.r{right:14px;flex-direction:row-reverse}.msw.l{left:14px}
.msw .mo{width:56px;height:56px;border-radius:50%;background:var(--s2);color:#fff;display:grid;place-items:center;position:relative;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background-color .25s ease,color .25s ease,transform .45s var(--spring)}
.msw .mo .ic{width:22px;height:22px}
.msw .mo svg.pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.msw .mo svg.pr circle{fill:none;stroke:var(--lime);stroke-width:3;stroke-linecap:round}
.msw .lb{background:var(--s2);color:#fff;border-radius:99px;padding:11px 16px;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:background-color .25s ease,color .25s ease}
.msw .lb small{color:var(--mu);font-weight:500;margin-left:5px;transition:color .25s ease}
.msw.go .mo{background:var(--lime);color:var(--ink);transform:scale(1.12)}
.msw.go .mo svg.pr{opacity:0}
.msw.go .lb{background:#fff;color:var(--ink)}.msw.go .lb small{color:rgba(13,13,13,.5)}
.mfill{position:fixed;inset:0;z-index:39;background:var(--lime);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  clip-path:circle(28px at var(--x,50%) var(--y,50%))}
.mfill.on{display:flex}
.mfill.grow{clip-path:circle(150vmax at var(--x,50%) var(--y,50%));transition:clip-path .5s cubic-bezier(.65,0,.35,1)}
.mfill.out{opacity:0;transition:opacity .5s ease}
.mfill small{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.5}
.mfill small .ic{width:15px;height:15px}
.mfill b{font-size:min(19vw,84px);font-weight:600;letter-spacing:-.045em;line-height:1;margin:10px 0 6px}
.mfill .yr{font-size:20px;font-weight:600;opacity:.5}
.mfill .t{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateX(calc(var(--d,1) * 60px))}
.mfill.grow .t{opacity:1;transform:none;transition:opacity .35s ease .18s,transform .7s var(--spring-soft) .14s}
.mfill.out .t{opacity:0;transform:translateY(-24px) scale(.96);transition:opacity .3s ease,transform .45s var(--ease-in)}
@media (prefers-reduced-motion:reduce){.nav-b.on,.view{animation:none!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;animation-delay:0s!important}body.modal .app{transform:none;filter:none}}
@media (max-width:370px){.title{font-size:40px}.big{font-size:40px}.dpill{padding:0 14px}.brand span{display:none}}
/* ---------- Accesso (schermo intero, sale dal basso come un modal iOS) ---------- */
.auth{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;border-radius:32px 32px 0 0;
  transform:translate3d(0,100%,0);visibility:hidden;transition:transform .42s var(--ease-in),border-radius .42s ease,visibility 0s .42s}
.auth.on{transform:none;visibility:visible;border-radius:0;transition:transform .7s var(--spring-soft),border-radius .7s ease,visibility 0s}
body.auth-open{overflow:hidden}
body.auth-open .app{transform:scale(.94);filter:brightness(.55);transition:transform .65s var(--spring-soft),filter .5s ease}
body.auth-open .nav{transform:translate(-50%,160%)}
.auth-in{max-width:520px;margin:0 auto;min-height:100%;padding:calc(var(--st) + 12px) 18px calc(var(--sb) + 26px);display:flex;flex-direction:column}
.auth.on .auth-in > *{animation:riseIn .75s var(--spring-soft) backwards;animation-delay:calc(.12s + var(--i,0) * 45ms)}
.a-top{display:flex;justify-content:space-between;align-items:center;height:58px;margin-bottom:14px}

.a-brand{font-size:26px;font-weight:700;letter-spacing:-.035em;padding-left:4px}
.a-title{margin:34px 0 26px}
.auth.on .auth-in > .a-title.swap{animation:aFade .5s var(--spring-soft)}
@keyframes aFade{from{opacity:0;transform:translate3d(0,10px,0)}}
.auth .seg{margin-bottom:22px}
.a-body.swap-r > *{animation:aInR .55s var(--spring-soft) backwards;animation-delay:calc(var(--i,0) * 35ms)}
.a-body.swap-l > *{animation:aInL .55s var(--spring-soft) backwards;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes aInR{from{opacity:0;transform:translate3d(30px,0,0)}}
@keyframes aInL{from{opacity:0;transform:translate3d(-30px,0,0)}}

/* campi con icona */
.afield{margin-bottom:14px}
.afield label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin:0 0 7px 6px}
.a-in{position:relative}
.a-in > .ic{position:absolute;left:20px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--di);pointer-events:none;transition:color .2s}
.a-in:focus-within > .ic{color:var(--lime)}
.a-in .input{padding-left:52px}
.a-in.pw .input{padding-right:58px}
.a-eye{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mu);transition:color .2s,transform .14s}
.a-eye:active{transform:scale(.88)}
.a-eye[aria-pressed="true"]{color:#fff}
.a-eye .ic{width:20px;height:20px}
.a-err{margin:7px 0 0 20px;color:var(--pink);font-size:12.5px;font-weight:600}
.a-err:empty{display:none}
.afield.bad .input{border-color:var(--pink)}
.afield.bad .a-in{animation:aShake .42s ease}
@keyframes aShake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

.a-link{display:block;color:var(--lime);font-size:14px;font-weight:600;padding:8px 6px}
.a-forgot{margin:-4px 0 14px auto}
.a-go{position:relative;margin-top:8px;gap:10px}
.a-go .ic{width:20px;height:20px}
.a-go.busy > *{opacity:0}
.a-go.busy::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(13,13,13,.22);border-top-color:var(--ink);animation:aSpin .7s linear infinite}

/* forza password */
.a-meter{display:flex;gap:6px;margin:-2px 8px 8px}
.a-meter i{flex:1;height:5px;border-radius:9px;background:var(--s3);transition:background-color .35s ease}
.a-meter[data-s="1"] i:nth-child(-n+1){background:var(--pink)}
.a-meter[data-s="2"] i:nth-child(-n+2){background:var(--lime2)}
.a-meter[data-s="3"] i:nth-child(-n+3),.a-meter[data-s="4"] i{background:var(--lime)}
.a-mt{margin-bottom:16px}

.a-alt{margin-top:auto;padding-top:26px}
.a-or{display:flex;align-items:center;gap:12px;color:var(--di);font-size:12.5px;font-weight:600;margin-bottom:14px}
.a-or::before,.a-or::after{content:'';flex:1;height:1px;background:var(--line)}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;margin-right:8px;background:var(--di);transition:background-color .3s}
.sdot.ok{background:var(--lime)}.sdot.sync{background:var(--lime2);animation:sPulse 1s ease-in-out infinite}.sdot.error{background:var(--pink)}.sdot.offline{background:var(--mu)}
@keyframes sPulse{50%{opacity:.35}}
.a-lead b{color:#fff}
.lrow .li.appi{background:none;overflow:hidden;border-radius:12px}
.lrow .li.appi img{width:100%;height:100%;display:block}
.steps{list-style:none;margin:6px 0 18px;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;font-size:14.5px;font-weight:500;color:#ddd;line-height:1.35}
.steps b{color:#fff}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--ink);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.steps .ic{width:18px;height:18px;vertical-align:-4px;color:var(--lime)}
.a-note{display:flex;gap:7px;justify-content:center;align-items:center;color:var(--di);font-size:12px;font-weight:500;margin:16px 10px 0;text-align:center}
.a-note .ic{width:15px;height:15px;flex:none}

/* email inviata */
.a-sent{text-align:center;padding:4px 0 18px}
.a-mail{position:relative;width:156px;height:156px;margin:0 auto 22px}
.a-mail > .ic{position:absolute;inset:0;margin:auto;width:54px;height:54px;color:var(--ink);animation:spinIn .9s var(--spring) .25s backwards}
.a-lead{font-size:17px;font-weight:500;color:#cfcfcf;margin:0 4px 12px;line-height:1.45}
.a-lead b{color:#fff;font-weight:700;word-break:break-all}
.a-sent + .btn{margin-bottom:6px}
.a-sent ~ .a-link{margin:0 auto}
</style>

<script>
(() => {
'use strict';

/* ===================== Dati & persistenza ===================== */
const K_SET = 'settings_v3', K_SH = 'shifts_v3', K_UI = 'turnix_ui_v1';

const DEFAULTS = {
  bonusMethod: 'tradizionale',  // tradizionale | fisso | ore
  bonusPerDay: 2.73,
  bonusBase: 86.15,
  hourly: 9.3842,
  divisor: 151,
  sundayPct: 12,
  nightPct: 20,
  holidayPct: 50,
  inpsPct: 9.76,
  irpefPct: 23,
  deductionMode: 'auto',        // auto | manuale
  deductionManual: 0,
  contract: 'determinato',      // determinato | indeterminato
  tfrPct: 6.91,
  tfrPrev: 111.11,
  tfrPrevUntil: '',             // YYYY-MM: mese fino al quale il TFR già maturato è aggiornato
  goal: 200,
  goalWithTips: true,
  name: '',                     // nome per il saluto in home
  nightStart: '22:00',
  nightEnd: '06:00',
};

const TYPES = {
  normale:  { label: 'Normale',  color: '#6cb6ff' },
  domenica: { label: 'Domenica', color: '#f2b24c' },
  festivo:  { label: 'Festivo',  color: '#f07f86' },
};

function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }

function loadSettings() {
  const raw = readJSON(K_SET) || {};
  const s = { ...DEFAULTS };
  for (const k of Object.keys(DEFAULTS)) {
    if (raw[k] !== undefined && typeof raw[k] === typeof DEFAULTS[k]) s[k] = raw[k];
  }
  return s;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const okTime = v => (/^\d{1,2}:\d{2}$/.test(v || '') ? String(v).padStart(5, '0') : '');

function normShift(s) {
  if (!s || typeof s !== 'object') return null;
  const date = String(s.date || s.data || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  let t = String(s.type || s.tipo || '').toLowerCase();
  let type = 'normale';
  if (t.startsWith('fest') || s.holiday === true || s.festivo === true) type = 'festivo';
  else if (t.startsWith('dom') || s.sunday === true || s.domenica === true) type = 'domenica';
  return {
    id: String(s.id || uid()),
    date,
    start: okTime(s.start || s.inizio),
    end: okTime(s.end || s.fine),
    breakMin: +(s.breakMin || s.pausa || 0) || 0,
    type,
    hours: +(s.hours || s.ore || 0) || 0,
    nightHours: +(s.nightHours || s.notturne || 0) || 0,
    tips: +(s.tips || s.mance || s.tip || 0) || 0,
    note: String(s.note || s.nota || ''),
  };
}
function loadShifts() {
  const raw = readJSON(K_SH);
  return Array.isArray(raw) ? raw.map(normShift).filter(Boolean) : [];
}

let settings = loadSettings();
const isPlan = s => String(s && s.id || '').startsWith('plan-');
let shifts = loadShifts(), plans = shifts.filter(isPlan);
shifts = shifts.filter(s => !isPlan(s));
const saveSettings = () => { localStorage.setItem(K_SET, JSON.stringify(settings)); cloudDirty(); };
const saveShifts = () => { localStorage.setItem(K_SH, JSON.stringify(shifts.concat(plans))); cloudDirty(); };

/* ===================== Utilità ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtEur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
const fmtEur0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtNum = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 2 });
const eur = v => fmtEur.format(v || 0);
const eur0 = v => fmtEur0.format(v || 0);
const n2 = v => fmtNum.format(v || 0);
const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const ymOf = ds => ds.slice(0, 7);
const parseDate = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLong = ym => cap(new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }));
const monthName = ym => cap(new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString('it-IT', { month: 'long' }));
const monthShort = ym => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString('it-IT', { month: 'short' }).replace('.', '');
const wdShort = ds => parseDate(ds).toLocaleDateString('it-IT', { weekday: 'short' }).replace('.', '');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hFmt = h => { const hh = Math.floor(h + 1e-9), mm = Math.round((h - hh) * 60); return mm ? `${hh}h ${pad(mm)}` : `${hh}h`; };
const monthState = ym => { const c = ymOf(todayStr()); return ym === c ? 'current' : ym < c ? 'past' : 'future'; };

/* Festività nazionali italiane */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
const FIXED_HOL = { '01-01': 'Capodanno', '01-06': 'Epifania', '04-25': 'Liberazione', '05-01': 'Festa del Lavoro', '06-02': 'Festa della Repubblica', '08-15': 'Ferragosto', '11-01': 'Ognissanti', '12-08': 'Immacolata', '12-25': 'Natale', '12-26': 'Santo Stefano' };
function holidayName(ds) {
  if (FIXED_HOL[ds.slice(5)]) return FIXED_HOL[ds.slice(5)];
  const e = easter(+ds.slice(0, 4));
  if (dateStr(e) === ds) return 'Pasqua';
  const em = new Date(e); em.setDate(em.getDate() + 1);
  if (dateStr(em) === ds) return 'Pasquetta';
  return '';
}
const autoType = ds => holidayName(ds) ? 'festivo' : parseDate(ds).getDay() === 0 ? 'domenica' : 'normale';

/* ===================== Motore di calcolo ===================== */
function shiftHours(s, st = settings) {
  if (s.start && s.end) {
    const a = toMin(s.start); let b = toMin(s.end);
    if (b <= a) b += 1440;
    const total = Math.max(0, (b - a - (s.breakMin || 0)) / 60);
    const ns = toMin(st.nightStart || '22:00'); let ne = toMin(st.nightEnd || '06:00');
    if (ne <= ns) ne += 1440;
    let night = 0;
    for (let d = -1; d <= 1; d++) night += Math.max(0, Math.min(b, ne + d * 1440) - Math.max(a, ns + d * 1440));
    return { hours: total, night: Math.min(total, night / 60) };
  }
  return { hours: s.hours || 0, night: Math.min(s.hours || 0, s.nightHours || 0) };
}

function computeMonth(list, ym, st = settings) {
  const r = { hours: 0, night: 0, base: 0, extraSun: 0, extraHol: 0, extraNight: 0, tips: 0, days: 0, count: 0,
    byType: { normale: 0, domenica: 0, festivo: 0 } };
  const days = new Set();
  const rate = st.hourly;
  for (const s of list) {
    const { hours: h, night: n } = shiftHours(s, st);
    r.hours += h; r.night += n; r.base += h * rate;
    if (s.type === 'domenica') r.extraSun += h * rate * st.sundayPct / 100;
    if (s.type === 'festivo') r.extraHol += h * rate * st.holidayPct / 100;
    r.extraNight += n * rate * st.nightPct / 100;
    r.tips += s.tips || 0;
    r.byType[s.type] = (r.byType[s.type] || 0) + h;
    if (h > 0) days.add(s.date);
    r.count++;
  }
  r.days = days.size;
  if (st.bonusMethod === 'fisso') r.bonus = r.days ? st.bonusBase : 0;
  else if (st.bonusMethod === 'ore') r.bonus = st.divisor ? st.bonusBase * r.hours / st.divisor : 0;
  else r.bonus = r.days * st.bonusPerDay;
  r.lordo = r.base + r.extraSun + r.extraHol + r.extraNight + r.bonus;
  r.inps = r.lordo * st.inpsPct / 100;
  r.imponibile = r.lordo - r.inps;
  r.irpefLorda = r.imponibile * st.irpefPct / 100;
  let detr = 0;
  if (r.lordo > 0) {
    if (st.deductionMode === 'manuale') detr = st.deductionManual;
    else {
      const min = st.contract === 'determinato' ? 1380 : 690;
      detr = Math.max(1955, min) * daysIn(ym) / 365;
    }
  }
  r.detrazione = Math.min(Math.max(0, detr), r.irpefLorda);
  r.irpef = r.irpefLorda - r.detrazione;
  r.netto = r.lordo - r.inps - r.irpef;
  r.tfr = r.lordo * st.tfrPct / 100;
  r.total = r.netto + r.tips;
  r.perHour = r.hours ? r.total / r.hours : 0;
  return r;
}

const shiftsOf = ym => shifts.filter(s => ymOf(s.date) === ym).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
let cache = new Map();
const stats = ym => { if (!cache.has(ym)) cache.set(ym, computeMonth(shiftsOf(ym), ym)); return cache.get(ym); };
const invalidate = () => { cache = new Map(); };

/* Valore marginale di un turno: quanto cambia il netto del mese aggiungendolo */
function marginal(draft, excludeId) {
  const ym = ymOf(draft.date);
  const others = shiftsOf(ym).filter(s => s.id !== excludeId);
  const without = computeMonth(others, ym), withS = computeMonth([...others, draft], ym);
  const { hours, night } = shiftHours(draft);
  return { netto: withS.netto - without.netto, lordo: withS.lordo - without.lordo, hours, night, tips: draft.tips || 0 };
}

function tfrTotal(uptoYm) {
  const months = [...new Set(shifts.map(s => ymOf(s.date)))].filter(m => m <= uptoYm && (!settings.tfrPrevUntil || m > settings.tfrPrevUntil));
  return settings.tfrPrev + months.reduce((a, m) => a + stats(m).tfr, 0);
}

/* ===================== Stato UI ===================== */

/* Ripartisce il netto del mese sui singoli turni in proporzione alla paga variabile (ore + maggiorazioni) */
function netShares(ym) {
  const list = shiftsOf(ym), r = stats(ym);
  const vars = list.map(s => { const c = computeMonth([s], ym); return c.base + c.extraSun + c.extraHol + c.extraNight; });
  const tot = vars.reduce((a, b) => a + b, 0) || 1;
  return list.map((s, i) => ({ s, net: r.netto * vars[i] / tot }));
}

/* ===================== HOME ===================== */
function weekData(ym) {
  const n = daysIn(ym), weeks = [];
  for (let d = 1; d <= n;) {
    const wd = (parseDate(`${ym}-${pad(d)}`).getDay() + 6) % 7, end = Math.min(n, d + 6 - wd);
    weeks.push({ from: d, to: end, start: `${ym}-${pad(d)}`, end: `${ym}-${pad(end)}`, net: 0, tips: 0, count: 0, hours: 0 });
    d = end + 1;
  }
  netShares(ym).forEach(({ s, net }) => {
    const day = +s.date.slice(8), w = weeks.find(w => day >= w.from && day <= w.to);
    w.net += net; w.tips += s.tips || 0; w.count++; w.hours += shiftHours(s).hours;
  });
  weeks.forEach(w => { w.v = w.net + w.tips; });
  return weeks;
}
function selWeek(ym, weeks) {
  if (ui.wk && ui.wk.ym === ym && weeks[ui.wk.i]) return ui.wk.i;
  const t = todayStr(); let i = weeks.findIndex(w => t >= w.start && t <= w.end);
  if (i < 0) i = weeks.reduce((bi, w, j) => (w.v > weeks[bi].v ? j : bi), 0);
  return i;
}
const wkState = w => { const t = todayStr(); return w.end < t ? 'Conclusa' : w.start > t ? 'Pianificata' : 'In corso'; };
const wkLabel = (w, ym) => `${w.from === w.to ? w.from : w.from + ' – ' + w.to} ${monthName(ym).toLowerCase()} · ${wkState(w)}`;
const wkChips = w => `<span class="chip-b">${ico('hand-coins')}+${eur(w.tips)} mance</span><span class="chip-b w">${w.count} ${w.count === 1 ? 'turno' : 'turni'} · ${hFmt(w.hours)}</span>`;

function weekCard(ym) {
  const weeks = weekData(ym), sel = selWeek(ym, weeks), w = weeks[sel], today = todayStr();
  const max = niceMax(Math.max(...weeks.map(w => w.v), 1)), H = 150;
  const cols = weeks.map((x, i) => {
    const state = x.end < today ? 'done' : x.start > today ? 'plan' : 'now';
    const hh = x.v > 0 ? Math.max(5, x.v / max * H) : 3;
    return `<button class="wk-col ${i === sel ? 'sel' : ''}" data-act="week" data-i="${i}" data-h="${hh}" aria-pressed="${i === sel}" aria-label="Settimana ${x.from}–${x.to}: ${eur(x.v)}"><i class="wb ${state} ${x.v > 0 ? '' : 'zero'}" style="height:${hh}px;animation-delay:${i * .05}s"></i><small>${x.from === x.to ? x.from : x.from + '–' + x.to}</small></button>`;
  }).join('');
  return `<div class="c-h">
      <div><h3 class="c-t">Guadagno settimanale</h3><p class="c-s" id="wkRange">${wkLabel(w, ym)}</p></div>
      <div class="lg col"><span><i style="background:${INK}"></i>Lavorato</span><span><i style="background:#fff"></i>Pianificato</span></div>
    </div>
    <div class="callout"><div class="cv"><span class="bw">${burst('#fff')}</span><b class="big num" id="wkVal" data-count="${w.v.toFixed(2)}">${moneyHTML(w.v)}</b></div></div>
    <div class="wk"><div class="wk-y num" aria-hidden="true"><span>${eur0(max)}</span><span>${eur0(max / 2)}</span><span>0</span></div><div class="wk-cols">${cols}<span class="lead" aria-hidden="true"></span></div></div>
    <div class="chips-row num" id="wkChips">${wkChips(w)}</div>`;
}
/* linea: dalla candela selezionata verso il valore, lasciando uno spazio (come nel riferimento) */
function placeLead(instant) {

}
function tweenMoney(el, from, to, dur = 650) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || Math.abs(to - from) < .01) { el.innerHTML = moneyHTML(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, Math.max(0, (t - t0) / dur)), e = p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); el.innerHTML = moneyHTML(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function selectWeek(i) {
  const ym = ui.month, weeks = weekData(ym), w = weeks[i]; if (!w) return;
  const prev = weeks[selWeek(ym, weeks)].v;
  ui.wk = { ym, i };

  const val = $('#wkVal'), cv = val.closest('.cv'); val.innerHTML = moneyHTML(w.v); alignCallout();
  cv.classList.remove('swap'); void cv.offsetWidth; cv.classList.add('swap'); tweenMoney(val, prev, w.v);
  placeLead();
}

function cumChart(ym) {
  const n = daysIn(ym), state = monthState(ym), daily = Array(n + 1).fill(0);
  netShares(ym).forEach(({ s, net }) => { daily[+s.date.slice(8)] += net + (s.tips || 0); });
  const pts = []; let acc = 0;
  for (let d = 0; d <= n; d++) { acc += daily[d]; pts.push(acc); }
  const W = 320, H = 118, pl = 36, pr = 8, pt = 8, pb = 18, ch = H - pt - pb, max = niceMax(acc || 1);
  const X = d => pl + d / n * (W - pl - pr), Y = v => pt + ch - v / max * ch;
  const cut = state === 'current' ? +todayStr().slice(8) : state === 'past' ? n : 0;
  const path = (a, b) => pts.slice(a, b + 1).map((v, i) => `${i ? 'L' : 'M'}${X(a + i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  let g = `<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef230" stop-opacity=".35"/><stop offset="1" stop-color="#eef230" stop-opacity="0"/></linearGradient></defs>`;
  [0, .5, 1].forEach(f => { g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="rgba(255,255,255,${f ? .1 : .22})" ${f ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 6}" y="${Y(max * f) + 3}" text-anchor="end">${eur0(max * f)}</text>`; });
  if (cut > 0) {
    g += `<path d="${path(0, cut)} L${X(cut)},${Y(0)} L${X(0)},${Y(0)} Z" fill="url(#cg)"/>`;
    g += `<path d="${path(0, cut)}" fill="none" stroke="#eef230" stroke-width="2.2" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 1s var(--ease) forwards"/>`;
  }
  if (cut < n) g += `<path d="${path(cut, n)}" fill="none" stroke="#eef230" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="3 4"/>`;
  if (cut > 0) g += `<circle cx="${X(cut)}" cy="${Y(pts[cut])}" r="9" fill="#eef230" fill-opacity=".2"/><circle cx="${X(cut)}" cy="${Y(pts[cut])}" r="4" fill="#eef230"/>`;
  [1, 15, n].forEach(d => { g += `<text x="${X(d)}" y="${H - 2}" text-anchor="middle">${d}</text>`; });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Guadagno cumulato nel mese">${g}</svg>`;
}
